server:
  port: 8080

spring:
  main:
    web-application-type: servlet
  application:
    name: batch
  quartz:
    job-store-type: jdbc
    scheduler-name: quartzScheduler
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceId: AUTO # 각 프로세스(인스턴스)에 고유 ID를 자동 부여
          threadPool:
            threadCount: 5 # 동시에 실행 가능한 Job 수(스레드 수)
            threadNamePrefix: QuartzScheduler
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore # JobStoreCMT를 상속받는 Spring wrapper
#            class: org.quartz.impl.jdbcjobstore.JobStoreTX # 트랜잭션 제어 / 서버 환경 없이 애플리케이션 운영
#            class: org.quartz.impl.jdbcjobstore.JobStoreCMT # 애플리케이션 서버 내에서 애플리케이션 운영 / 컨테이너가 트랜잭션 관리
            misfireThreshold: 6000 # 미스파이어 허용 오차(ms)
            isClustered: true
            # 테이블 prefix 변경
            tablePrefix: QRTZ_
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

  jpa:
    hibernate:
      ddl-auto: none
    #    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true